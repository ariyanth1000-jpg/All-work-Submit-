<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast WebView</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

/* TOPBAR */
.topbar{
  height:50px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
}

/* DROPDOWN */
select{
  width:100%;
  max-width:400px;
  height:38px;
  border:none;
  outline:none;

  background:#00c853;
  color:#fff;

  font-size:15px;
  font-weight:bold;

  text-align:center;
  text-align-last:center;

  border-radius:20px;
  padding:0 15px;

  cursor:pointer;

  box-shadow:
    0 0 8px rgba(0,200,83,.5),
    0 0 15px rgba(0,200,83,.3);
  transition: box-shadow .2s ease;
}

select:hover{
  box-shadow:
    0 0 12px rgba(0,200,83,.7),
    0 0 20px rgba(0,200,83,.4);
}

/* WEBVIEW */
.webviews{
  position:absolute;
  top:50px;
  left:0;
  right:0;
  bottom:0;
}

iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:none;
}

iframe.active{
  display:block;
}

/* LOCK */
.locked .topbar{
  display:none;
}

.locked .webviews{
  top:0; /* fullscreen when locked */
}

/* LOCK BUTTON */
.lockBtn{
  position:fixed;
  bottom:10px;
  right:10px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(0,200,83,.9);
  color:#fff;
  font-size:18px;
  z-index:9999;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 2px 8px rgba(0,0,0,.25);
  transition: transform .12s ease, background .2s ease;
}

.lockBtn:hover{
  background:rgba(0,200,83,1);
}

.lockBtn:active{
  transform:scale(.92);
}
</style>
</head>

<body>

<div class="topbar">
  <select id="tabSelect">
    <option value="t1">ⓕ FB Cookies ID</option>
    <option value="t2">ⓕ FB Mail Added ID</option>
    <option value="t3">ⓕ Meta AI Project</option>
    <option value="t4">ⓕ FB Normal ID</option>
    <option value="t5">ⓕ FB Recovery old ID</option>
    <option value="t6">ⓕ FB Recovery New ID</option>
    <option value="t7">🅾 IG Normal ID</option>
    <option value="t8">🅾 IG Cookies ID</option>
  </select>
</div>

<div class="webviews">
  <iframe id="t1" src="https://ariyanth1000-jpg.github.io/Fb-Cookies-ID-submit/"></iframe>
  <iframe id="t2" src="https://ariyanth1000-jpg.github.io/Submit-ID"></iframe>
  <iframe id="t3" src="https://ariyanth1000-jpg.github.io/Meta-Ai-project-submit/"></iframe>
  <iframe id="t4" src="https://example.com"></iframe>
  <iframe id="t5" src="https://example.com"></iframe>
  <iframe id="t6" src="https://example.com"></iframe>
  <iframe id="t7" src="https://ariyanth1000-jpg.github.io/Instragram-submit"></iframe>
  <iframe id="t8" src="https://example.com"></iframe>
</div>

<button class="lockBtn" id="lockBtn">🔒</button>

<script>
const select = document.getElementById("tabSelect");
const frames = document.querySelectorAll("iframe");
const body = document.body;
const lockBtn = document.getElementById("lockBtn");

// Function to show iframe tab
function show(id){
  frames.forEach(f => f.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  localStorage.setItem("tab", id);
}

// Dropdown change
select.onchange = e => show(e.target.value);

// Lock button
lockBtn.onclick = () => {
  body.classList.toggle("locked");
  if(body.classList.contains("locked")){
    localStorage.setItem("locked", "true");
  } else {
    localStorage.setItem("locked", "false");
  }
};

// Initialize saved tab and locked state
let savedTab = localStorage.getItem("tab") || "t1";
select.value = savedTab;
show(savedTab);

if(localStorage.getItem("locked") === "true"){
  body.classList.add("locked");
}
</script>

</body>
</html>
